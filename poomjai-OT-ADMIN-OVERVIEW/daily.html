<body><div id="app"></div>
<script>
const PAGE_MODE = 'daily';
// ===== OT/ขาดลามาสาย engine — logic copied from the department calendar pages =====
const ENGINE = (() => {
  const TIMESHEET_FROM = '2026-09';
  const NIGHT_PERMANENT = ['450678','450573','450846','450925','450958','450965','450966','450512'];
  const TMS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const pad = (n) => String(n).padStart(2, '0');
  const pT = (t) => { if (!t) return null; const m = String(t).trim().match(/^(\d{1,2})[:.](\d{2})/); return m ? (+m[1]) * 60 + (+m[2]) : null; };
  const labelOf = (prefix) => { const [y, m] = prefix.split('-').map(Number); return `${TMS[m - 1]}${String(y + 543).slice(-2)}`; };
  const prefixOf = (label) => { const mt = String(label || '').match(/^(.+?)(\d+)$/); if (!mt) return ''; const mi = TMS.indexOf(mt[1]); if (mi < 0) return ''; return `${2500 + (+mt[2]) - 543}-${pad(mi + 1)}`; };

  function make(G) { // G: {holidays:[], startDates:{}, hrAtt:{}, rosterHire:{}}
    const hol = new Set(G.holidays || []);
    const isWeekend = (iso) => { if (hol.has(iso)) return true; const wd = new Date(iso + 'T00:00:00').getDay(); return wd === 0 || wd === 6; };
    const deriveShift = (tin, tout, empId) => {
      const i = pT(tin), o = pT(tout);
      if (i !== null) { if (i >= 1020) return 'night'; if (i < 420 && o !== null && o <= 660 && o > i) return 'night'; return 'day'; }
      if (o !== null && o <= 660) return 'night';
      return NIGHT_PERMANENT.includes(String(empId)) ? 'night' : 'day';
    };
    const inferLeave = (note) => {
      const t = String(note || ''); if (!t.trim()) return null; let lt = '';
      if (/ลาป่วย|ป่วย/.test(t)) lt = /ใบรับรอง|ใบแพทย์|มีใบ/.test(t) ? 'sick_cert' : 'sick';
      else if (/ลากิจ/.test(t)) lt = 'personal'; else if (/พักร้อน/.test(t)) lt = 'vacation';
      if (!lt) return null;
      return { leaveType: lt, leaveDuration: /ครึ่ง|0\.5\s*วัน/.test(t) ? 'half' : (/ชม|ชั่วโมง/.test(t) ? 'hour' : 'day'), reason: t };
    };
    const leaveHours = (r) => {
      if (!r || !r.leaveType) return 0; const dur = r.leaveDuration || 'day';
      if (dur === 'half') return 4;
      if (dur === 'hour') {
        const s = pT(r.leaveStart), e = pT(r.leaveEnd);
        if (s !== null && e !== null && e > s) return Math.round(((e - s) / 60) * 100) / 100;
        const t = String(r.reason || '');
        const rg = t.match(/(\d{1,2})[.:](\d{2})\s*[-–]\s*(\d{1,2})[.:](\d{2})/);
        if (rg) { const d = (+rg[3] * 60 + +rg[4]) - (+rg[1] * 60 + +rg[2]); if (d > 0) return Math.round((d / 60) * 100) / 100; }
        const hm = t.match(/(\d+(?:\.\d+)?)\s*(?:ชม|ชั่วโมง)/); if (hm && parseFloat(hm[1]) > 0) return parseFloat(hm[1]);
        return 1;
      }
      return 8;
    };
    const lateRule = (tin, note) => {
      const n = String(note || '');
      const mh = n.match(/ขาด(?:งาน)?\s*([\d.]+)\s*(?:ชั่วโมง|ชม)/); if (mh) return { late: false, ah: parseFloat(mh[1]) || 0, ad: 0 };
      const md = n.match(/ขาด(?:งาน)?\s*([\d.]+)\s*วัน/); if (md) return { late: false, ah: 0, ad: parseFloat(md[1]) || 0 };
      if (/(^|[^ก-๙])(มา)?สาย/.test(n)) return { late: true, ah: 0, ad: 0 };
      const im = pT(tin);
      if (im === null || im <= 480) return { late: false, ah: 0, ad: 0 };
      if (im < 540) return { late: true, ah: 0, ad: 0 };
      if (im < 720) return { late: false, ah: Math.ceil((im - 480) / 30) * 0.5, ad: 0 };
      return { late: false, ah: 0, ad: 0 };
    };
    const otHours = (timeOut, timeIn, iso, shift, skipped) => {
      let o = pT(timeOut); if (o === null) return 0; const i = pT(timeIn);
      if (isWeekend(iso)) {
        if (i === null) return 0;
        const ic = Math.ceil(Math.max(i, 480) / 30) * 30; if (o < ic) o += 1440;
        let d = o - ic; d -= Math.max(0, Math.min(o, 780) - Math.max(ic, 720));
        if (!skipped) d -= Math.max(0, Math.min(o, 1110) - Math.max(ic, 1080));
        if (d <= 0) return 0; return Math.floor(d / 60) + ((d % 60) >= 30 ? 0.5 : 0);
      }
      if (shift === 'night') {
        if (i === null) return 0; const nm = (m) => (m < 720 ? m + 1440 : m);
        const inN = nm(i), cut = nm(300), outN = Math.min(nm(o), nm(480)); const st = inN <= cut ? cut : inN;
        let d = outN - st; d -= Math.max(0, Math.min(outN, nm(330)) - Math.max(st, nm(300)));
        if (d <= 0) return 0; return Math.floor(d / 30) * 0.5;
      }
      let st = 1080; if (i !== null && i > 1080) st = i;
      if (o < st - 720) o += 1440;
      else if (i !== null && o < st && o < 720 && (o < i || o - i < 120)) o += 1440;
      let d = o - st; if (d < 0) d = 0;
      if (!skipped) d -= Math.max(0, Math.min(o, 1110) - Math.max(st, 1080));
      if (d <= 0) return 0; return Math.floor(d / 30) * 0.5;
    };
    // mergedForEmp for every employee of one department in one pass
    const mergeDept = (logs) => {
      const all = new Map(); const later = (a, b) => !b || new Date(a) >= new Date(b);
      (logs || []).forEach(h => {
        const savedAt = h.savedAt || 0;
        const isImport = h.source === 'import' || /^(admin|timesheet_|cnc_timesheet_|correction-timesheet)/.test(h.source || '');
        const fromEmployee = h.source === 'calendar-self';
        (h.rows || []).forEach(r => {
          if (!r || !r.empId || !r.date) return;
          const id = String(r.empId).trim();
          let byDate = all.get(id); if (!byDate) { byDate = new Map(); all.set(id, byDate); }
          const prev = byDate.get(r.date) || {};
          const next = { ...prev, empId: id, name: r.name || prev.name, date: r.date };
          const lock = r.date >= TIMESHEET_FROM && !isImport;
          if (!lock && (r.timeIn || isImport) && later(savedAt, prev._tIn)) { next.timeIn = r.timeIn || ''; next._tIn = savedAt; }
          if (!lock && (r.timeOut || isImport) && later(savedAt, prev._tOut)) { next.timeOut = r.timeOut || ''; next._tOut = savedAt; }
          if (isImport && later(savedAt, prev._hnAt)) { next.hrNote = (r.reason || '').trim(); next._hnAt = savedAt; }
          if ((r.reason || r.normalAttend || !isImport) && later(savedAt, prev._rAt)) { next.reason = r.reason; next.normalAttend = r.normalAttend; next._rAt = savedAt; }
          else if (isImport && ((r.timeIn && r.timeOut && /ไม่ได้สแกนนิ้ว|สแกนครั้งเดียว|สแกนนิ้วขาเดียว|สแกนขาเดียว/.test(next.reason || '')) || /^\s*(มา)?สาย\s*$|^\s*ขาด(งาน)?\s*$/.test(next.reason || '')) && later(savedAt, prev._rAt)) { next.reason = ''; next._rAt = savedAt; }
          const nl = isImport && !r.leaveType ? inferLeave(r.reason) : null;
          const lt = r.leaveType || (nl && nl.leaveType) || '';
          if (!fromEmployee && lt && later(savedAt, prev._lAt)) { next.leaveType = lt; next.leaveDuration = r.leaveType ? r.leaveDuration : nl.leaveDuration; next.leaveStart = r.leaveStart; next.leaveEnd = r.leaveEnd; next.leaveReason = r.reason || ''; next._lAt = savedAt; }
          if (later(savedAt, prev._sAt)) { next.shift = r.shift; next.skippedBreak = r.skippedBreak; next._sAt = savedAt; }

// Build every month × department × employee record
// D: { holidays, startDates, hrAtt, depts:[{prefix,label,group,rows,history,monthlyLeave,roster}] }
// พนักงานที่ได้รับยกเว้นการสแกนนิ้ว: นับเป็นพนักงานทุกเดือน ไม่นับขาดงานจากการไม่สแกน แต่ยังนับลา/ขาดจากหมายเหตุ
const SCAN_EXEMPT = { '450822': 'SALE & MARKETTING' };
function buildAll(D, fromPrefix) {
  const rosterHire = {};
  D.depts.forEach(d => (d.roster || []).forEach(r => { if (r && r.empId && r.hireDate) rosterHire[String(r.empId).trim()] = r.hireDate; }));
  const E = ENGINE.make({ holidays: D.holidays, startDates: D.startDates, hrAtt: D.hrAtt, rosterHire });
  const months = []; let [y, m] = fromPrefix.split('-').map(Number);
  while (`${y}-${ENGINE.pad(m)}` <= E.nowPrefix) { months.push(`${y}-${ENGINE.pad(m)}`); m++; if (m > 12) { m = 1; y++; } }
  const hrActive = new Set(); Object.keys(D.hrAtt || {}).forEach(k => { const v = D.hrAtt[k] || {}; if (v.actualTimeIn || v.leaveType) { const i = k.lastIndexOf('_'); hrActive.add(k.slice(0, i) + '_' + k.slice(i + 1, i + 8)); } });
  const G_hr = (id, prefix) => hrActive.has(id + '_' + prefix);
  const mergedBy = {};
  // พนักงานอยู่แผนกไหน ยึดตามรายชื่อ (_rows) — คนที่มีแค่ใน history ของแผนกอื่นจะไม่ถูกนับซ้ำ
  const rosterOf = {};
  D.depts.forEach(d => (d.rows || []).forEach(r => { if (r && r.empId) { const id = String(r.empId).trim(); (rosterOf[id] = rosterOf[id] || new Set()).add(d.label); } }));
  // เดือนแรกที่มีข้อมูลสแกนในระบบ (ก่อนหน้านั้นใช้รายชื่อ + สรุปที่นำเข้าเหมือนเดิม)
  let scanFrom = '';
  D.depts.forEach(d => (d.history || []).forEach(h => (h.rows || []).forEach(r => { if (r && r.date && (r.timeIn || r.timeOut) && (!scanFrom || r.date < scanFrom)) scanFrom = r.date; })));
  scanFrom = scanFrom.slice(0, 7);
  const recs = []; // {month, dept, group, empId, name, ot, otDays, late, absentDays, absentHours, personal, sick, vacation}
  D.depts.forEach(d => {
    const merged = E.mergeDept(d.history); mergedBy[d.label] = merged;
    const names = {}; const rosterIds = new Set();
    Object.keys(SCAN_EXEMPT).forEach(id => { if (SCAN_EXEMPT[id] === d.label) rosterIds.add(id); });
    (d.rows || []).forEach(r => { if (r && r.empId) { const id = String(r.empId).trim(); rosterIds.add(id); names[id] = r.name || names[id]; } });
    merged.forEach((byDate, id) => { if (!names[id]) { for (const v of byDate.values()) { if (v.name) { names[id] = v.name; break; } } } });
    const ml = (d.monthlyLeave || []).filter(r => r && r.empId && r.month);
    ml.forEach(r => { const id = String(r.empId).trim(); if (!names[id] && r.name) names[id] = r.name; });
    months.forEach(prefix => {
      const label = ENGINE.labelOf(prefix);
      const [yy, mm] = prefix.split('-').map(Number); const monthEnd = `${prefix}-${ENGINE.pad(new Date(yy, mm, 0).getDate())}`;
      const ids = new Set();
      rosterIds.forEach(id => { const sd = E.startOf(id); if (!sd || sd <= monthEnd) ids.add(id); });
      merged.forEach((byDate, id) => { for (const k of byDate.keys()) { if (k.startsWith(prefix)) { ids.add(id); break; } } });
      ml.forEach(r => { if (r.month === label) ids.add(String(r.empId).trim()); });
      const importedIds = new Set(ml.filter(r => r.month === label).map(r => String(r.empId).trim()));
      ids.forEach(id => {
        // คนที่อยู่ในรายชื่อแผนกอื่น ไม่นับในแผนกนี้
        if (!rosterIds.has(id) && rosterOf[id] && !rosterOf[id].has(d.label)) return;
        // ตัดคนลาออก: ตั้งแต่เดือนที่มีข้อมูลสแกน ต้องมีสแกน/การลาในเดือนนั้น หรือมีสรุปที่นำเข้า
        // (ยกเว้นคนในรายชื่อที่ไม่เคยสแกนเลย เช่น ผู้ที่ได้รับยกเว้นการสแกน หรือพนักงานใหม่ที่ยังไม่เริ่มสแกน)
        if (scanFrom && prefix >= scanFrom && !importedIds.has(id)) {
          const mgx = merged.get(id); let active = false, everScan = false;
          if (mgx) mgx.forEach((v, k) => { if (v.timeIn || v.timeOut) { everScan = true; if (k.startsWith(prefix)) active = true; } else if (k.startsWith(prefix) && v.leaveType) active = true; });
          if (!active && !(G_hr(id, prefix))) { if (everScan || !rosterIds.has(id)) return; }
        }
        const mg = merged.get(id) || new Map();
        const o = E.monthOt(id, mg, prefix);
        const s = { vacation: 0, personal: 0, sickNoCert: 0, sickCert: 0, absentDays: 0, lateCount: 0, absentHours: 0 };
        const imported = ml.filter(r => String(r.empId).trim() === id && r.month === label);
        // นับขาด/ลา/มาสายจากใบลงเวลา เฉพาะคนที่มีเวลาสแกนในเดือนนั้น (คนที่ไม่ต้องสแกน/ยังไม่เริ่มงาน ไม่ถูกนับขาดทั้งเดือน)
        let scanned = false, first = '';
        mg.forEach((v, k) => { if (v.timeIn || v.timeOut) { if (!first || k < first) first = k; if (k.startsWith(prefix)) scanned = true; } else if (v.leaveType && k.startsWith(prefix)) scanned = true; });
        if (prefix >= ENGINE.TIMESHEET_FROM && (prefix === E.nowPrefix || !imported.length) && (scanned || SCAN_EXEMPT[id])) {
          const t = E.monthStats(id, mg, prefix, SCAN_EXEMPT[id] ? '9999-99-99' : first); Object.keys(s).forEach(k => s[k] += t[k] || 0);
        }
        if (prefix < E.nowPrefix) imported.forEach(r => Object.keys(s).forEach(k => s[k] += parseFloat(r[k]) || 0));
        recs.push({ month: prefix, dept: d.label, group: d.group, empId: id, name: names[id] || id, ot: o.ot, otDays: o.otDays,
          late: s.lateCount, absentDays: s.absentDays, absentHours: s.absentHours, personal: s.personal, sick: s.sickNoCert + s.sickCert, vacation: s.vacation });
      });
    });
  });
  return { months, recs, nowPrefix: E.nowPrefix, todayIso: E.todayIso, E, mergedBy };
}

// ---------- monthly chart (ภาพรวม + รายบุคคล) ----------
const inView = (r) => (!S.scope || S.scope.includes(r.dept)) && (!S.dept || r.dept === S.dept) && (S.group === 'ALL' || groupOf[r.dept] === S.group);
const METRICS = [
  { k: 'ot', l: 'OT', u: 'ชม.', c: '#257de0' }, { k: 'late', l: 'มาสาย', u: 'ครั้ง', dp: 0, c: '#d9534f' },
  { k: 'absent', l: 'ขาดงาน', u: 'วัน', c: '#c62828' }, { k: 'personal', l: 'ลากิจ', u: 'วัน', c: '#7b61c9' }, { k: 'sick', l: 'ลาป่วย', u: 'วัน', c: '#00a389' }
];
const MC = {};
function seriesOf(filter) {
  return S.monthsAvail.map(m => { const t = total(S.data.recs.filter(r => r.month === m && filter(r)));
    return { m, n: t.n, ot: t.ot, late: t.late, absent: t.absentDays + t.absentHours / 8, personal: t.personal, sick: t.sick, otPeople: t.otPeople }; });
}
function monthCard(key, series, title, sub) {
  MC[key] = Object.assign(MC[key] || {}, { series, metric: (MC[key] && MC[key].metric) || 'ot', title, sub });
  return `<section class="card mcard" id="mc-${key}">${monthCardInner(key)}</section>`;
}
function monthCardInner(key) {
  const st = MC[key], mt = METRICS.find(x => x.k === st.metric), sr = st.series;
  const W = 760, H = 250, L = 48, R = 10, Tp = 24, B = 30;
  const vals = sr.map(s => s[mt.k]); const raw = Math.max(...vals, 0) * 1.1 || 1;
  const mag = Math.pow(10, Math.floor(Math.log10(raw / 4))); const stepV = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s * 4 >= raw); const max = stepV * 4;
  const slot = (W - L - R) / sr.length, bw = Math.min(46, slot * 0.62);
  const y = (v) => Tp + (H - Tp - B) * (1 - v / max);
  let g = ''; for (let i = 0; i <= 4; i++) { const v = stepV * i; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L - 6}" y="${y(v) + 4}" class="ax" text-anchor="end">${fmt(v, mt.dp === 0 ? 0 : 1)}</text>`; }
  const inSel = (m) => key === 'emp' ? m === MC.emp.cur : (m >= S.from && m <= S.month);
  const sel = -1;
  const bars = sr.map((s, i) => { const v = s[mt.k], cx = L + slot * i + slot / 2, top = y(v), cur = s.m === S.data.nowPrefix;
    return `<g class="mb" data-m="${s.m}" data-tip="${mLong(s.m)}${cur ? ' (ยังไม่ครบเดือน)' : ''}|${mt.l} ${fmt(v, mt.dp === 0 ? 0 : 1)} ${mt.u}${mt.k === 'ot' && s.n ? ` · เฉลี่ย ${fmt(s.ot / s.n)} ชม./คน` : ''}">
      <rect x="${L + slot * i}" y="${Tp}" width="${slot}" height="${H - Tp - B}" fill="transparent"/>
      ${v > 0 ? (y(0) - top >= 5 ? `<path d="M${cx - bw / 2},${y(0)} V${top + 4} q0,-4 4,-4 h${bw - 8} q4,0 4,4 V${y(0)} Z" fill="${mt.c}" opacity="${inSel(s.m) ? 1 : cur ? 0.35 : 0.55}"/>` : `<rect x="${cx - bw / 2}" y="${y(0) - 2}" width="${bw}" height="2" fill="${mt.c}"/>`) : ''}
      ${v > 0 ? `<text x="${cx}" y="${top - 5}" text-anchor="middle" class="bv${inSel(s.m) ? ' sel' : ''}">${fmt(v, mt.dp === 0 ? 0 : 1)}</text>` : ''}
      <text x="${cx}" y="${H - 10}" text-anchor="middle" class="ax${inSel(s.m) ? ' axs' : ''}">${mShort(s.m)}${cur ? '*' : ''}</text></g>`; }).join('');
  const row = (m) => `<tr><td>${m.l} (${m.u})</td>${sr.map(s => `<td class="num${inSel(s.m) ? ' selc' : ''}">${s[m.k] ? fmt(s[m.k], m.dp === 0 ? 0 : 1) : '–'}</td>`).join('')}<td class="num strong">${fmt(sr.filter(s => key !== 'main' || inSel(s.m)).reduce((t, s) => t + s[m.k], 0), m.dp === 0 ? 0 : 1)}</td></tr>`;
  return `<div class="card-h"><div><h2>${st.title}</h2><span class="muted">${st.sub} · ทุกเดือนที่มีข้อมูล · ${key === 'main' ? 'แท่งเข้ม = ช่วงที่เลือก · ' : ''}คลิกแท่งเพื่อเปิดเดือนนั้น</span></div>
    <div class="mtabs no-print">${METRICS.map(m => `<button class="mtab ${m.k === st.metric ? 'on' : ''}" data-mk="${m.k}">${m.l}</button>`).join('')}</div></div>
    <svg viewBox="0 0 ${W} ${H}" class="trend mchart">${g}<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="#c9d0d8"/>${bars}</svg>
    ${sr.some(s => s.m === S.data.nowPrefix) ? '<div class="muted" style="font-size:12px">* เดือนปัจจุบัน ยังไม่ครบเดือน · OT มีข้อมูลตั้งแต่ ส.ค.69</div>' : ''}
    <div class="tbl-wrap"><table class="tbl mtbl"><thead><tr><th></th>${sr.map(s => `<th class="num">${mShort(s.m)}</th>`).join('')}<th class="num">${key === 'main' ? 'รวมช่วงที่เลือก' : 'รวม'}</th></tr></thead><tbody>${METRICS.map(row).join('')}</tbody></table></div>`;
}
function bindMonthCard(key, onMonth) {
  const box = document.getElementById('mc-' + key); if (!box) return;
  box.querySelectorAll('.mtab').forEach(b => b.onclick = (e) => { e.stopPropagation(); MC[key].metric = b.dataset.mk; box.innerHTML = monthCardInner(key); bindMonthCard(key, onMonth); });
  box.querySelectorAll('.mb').forEach(g => g.onclick = () => onMonth(g.dataset.m));
  bindTips();
}

function trendChart() {
  const months = S.monthsAvail.filter(m => S.data.recs.some(r => r.month === m && r.ot > 0));
  if (months.length < 2) return '<div class="empty">ข้อมูล OT ยังมีไม่ถึง 2 เดือน</div>';
  const vals = months.map(m => total(recsOf(m, S.group)).ot);
  const W = 520, H = 230, L = 52, R = 16, Tp = 18, B = 34;
  const raw = Math.max(...vals) * 1.08 || 1, mag = Math.pow(10, Math.floor(Math.log10(raw / 4)));
  const stepV = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s * 4 >= raw); const max = stepV * 4;
  const step = (W - L - R) / Math.max(1, months.length - 1);
  const x = (i) => L + i * step, y = (v) => Tp + (H - Tp - B) * (1 - v / max);
  const ticks = 4; let grid = '';
  for (let i = 0; i <= ticks; i++) { const v = stepV * i; grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L - 8}" y="${y(v) + 4}" class="ax" text-anchor="end">${fmt(v, 0)}</text>`; }
  const path = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i)},${y(v)}`).join(' ');
  const sel = months.indexOf(S.month);
  return `<svg viewBox="0 0 ${W} ${H}" class="trend">${grid}
    <path d="${path}" fill="none" stroke="#257de0" stroke-width="2"/>
    ${vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${i === sel ? 6 : 4}" fill="${i === sel ? '#257de0' : '#fff'}" stroke="#257de0" stroke-width="2"/>
      <rect x="${x(i) - step / 2}" y="${Tp}" width="${step}" height="${H - Tp - B}" fill="transparent" data-tip="${mLong(months[i])}|OT ${fmt(v)} ชม." style="cursor:pointer" onclick="S.month='${months[i]}';render()"/>
      <text x="${x(i)}" y="${H - 12}" class="ax" text-anchor="middle" ${i === sel ? 'font-weight="700"' : ''}>${mShort(months[i])}${months[i] === S.data.nowPrefix ? '*' : ''}</text>`).join('')}
    ${sel >= 0 ? `<text x="${x(sel)}" y="${y(vals[sel]) - 12}" text-anchor="middle" class="vl">${fmt(vals[sel])}</text>` : ''}
  </svg>${months.includes(S.data.nowPrefix) ? '<div class="muted" style="font-size:12px">* เดือนปัจจุบัน ยังไม่ครบเดือน</div>' : ''}`;
}

function deptTable(recs) {
  const m = byDept(recs);
  const rows = Object.keys(m).map(k => ({ k, g: groupOf[k], ...m[k], avg: m[k].n ? m[k].ot / m[k].n : 0 }));
  const sk = S.sortKey; rows.sort((a, b) => sk === 'k' ? a.k.localeCompare(b.k) : (b[sk] - a[sk]));

    <tbody>${rows.map(r => `<tr data-dept="${esc(r.k)}" class="click">
      <td><b>${esc(r.k)}</b></td><td><span class="gtag"><i style="background:${gInfo(r.g).color}"></i>${gInfo(r.g).label}</span></td>

      <td class="num">${fmt(r.personal)}</td><td class="num">${fmt(r.sick)}</td></tr>`).join('')}</tbody>

  </table></div>`;

function top5(recs, title, val, label) {

    <tbody>${recs.map(r => `<tr class="click" data-emp="${esc(r.empId)}" data-edept="${esc(r.dept)}"><td>${esc(r.empId)}</td><td><span class="link">${esc(r.name)}</span></td><td class="num strong">${fmt(r.ot)}</td><td class="num">${fmt(r.otDays, 0)}</td><td class="num ${r.late ? 'warn' : ''}">${fmt(r.late, 0)}</td><td class="num ${r.absentDays || r.absentHours ? 'warn' : ''}">${r.absentDays || r.absentHours ? daysTxt(r.absentDays, r.absentHours) : '0'}</td><td class="num">${fmt(r.personal)}</td><td class="num">${fmt(r.sick)}</td><td class="num">${fmt(r.vacation)}</td></tr>`).join('')}</tbody></table></div>`;

function empBars(recs) {
  const rows = recs.filter(r => r.ot > 0).sort((a, b) => b.ot - a.ot).slice(0, 15);

}

function openDept(dept) {
  const recs = aggRange(S.from || S.month, S.month, r => r.dept === dept).sort((a, b) => b.ot - a.ot);
  const t = total(recs);
  $('#drawer').innerHTML = `<div class="ov" onclick="if(event.target===this)this.parentNode.innerHTML=''"><div class="sheet">
    <div class="card-h"><div><h2>${esc(dept)} · ${rangeLabel(S.from || S.month, S.month)}</h2><div class="muted">${fmt(t.n, 0)} คน · OT ${fmt(t.ot)} ชม. · มาสาย ${fmt(t.late, 0)} ครั้ง · ขาด ${daysTxt(t.absentDays, t.absentHours)} · ลากิจ ${fmt(t.personal)} วัน · ลาป่วย ${fmt(t.sick)} วัน</div></div>
    <button class="ghost" onclick="document.getElementById('drawer').innerHTML=''">ปิด ✕</button></div>
    ${empTable(recs)}
  </div></div>`;
  bindEmp();
}

function bindEmp() {
  document.querySelectorAll('[data-emp]').forEach(el => el.onclick = (e) => { e.stopPropagation(); openEmp(el.dataset.edept, el.dataset.emp, S.month); });
}

const WD = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
const LT = { sick: 'ลาป่วย', sick_cert: 'ลาป่วย (มีใบแพทย์)', personal: 'ลากิจ', vacation: 'พักร้อน', maternity: 'ลาคลอด' };
function openEmp(dept, empId, month) {
  const merged = (S.data.mergedBy[dept] || new Map()).get(String(empId)) || new Map();
  const rec = S.data.recs.find(r => r.month === month && r.dept === dept && r.empId === String(empId)) || {};
  const name = rec.name || (S.data.recs.find(r => r.empId === String(empId)) || {}).name || empId;
  MC.emp = Object.assign(MC.emp || {}, { cur: month });
  const days = S.data.E.dayList(String(empId), merged, month);
  const [y, m] = month.split('-').map(Number); const lead = new Date(y, m - 1, 1).getDay();
  const otDays = days.filter(d => d.ot > 0);
  const i = S.monthsAvail.indexOf(month);
  const prev = i > 0 ? S.monthsAvail[i - 1] : '', next = i >= 0 && i < S.monthsAvail.length - 1 ? S.monthsAvail[i + 1] : '';
  const cell = (d) => {
    let cls = 'cd'; if (d.wk) cls += ' wk'; if (d.holiday) cls += ' hol'; if (d.absent) cls += ' ab'; if (d.lt) cls += ' lv'; if (d.ot > 0) cls += ' has-ot'; if (d.future) cls += ' fut';
    const tags = [];
    if (d.holiday) tags.push('<em class="t-h">วันหยุดบริษัท</em>');
    if (d.lt) tags.push(`<em class="t-l">${LT[d.lt] || d.lt}${d.ld === 'half' ? ' ครึ่งวัน' : d.ld === 'hour' ? ` ${fmt(d.leaveHrs)} ชม.` : ''}</em>`);
    if (d.absent) tags.push('<em class="t-a">ขาดงาน</em>');
    if (d.ad > 0) tags.push(`<em class="t-a">ขาด ${fmt(d.ad)} วัน</em>`);
    if (d.ah > 0) tags.push(`<em class="t-a">ขาด ${fmt(d.ah)} ชม.</em>`);
    if (d.late) tags.push('<em class="t-a">มาสาย</em>');
    if (d.shift === 'night' && (d.tin || d.tout)) tags.push('<em class="t-n">กะดึก</em>');
    const time = (d.tin || d.tout) ? `<div class="tm">${esc(d.tin || '–')} – ${esc(d.tout || '–')}</div>` : '';
    const tip = d.note ? ` title="${esc(d.note)}"` : '';
    return `<div class="${cls}"${tip}><div class="dn">${d.d}</div>${time}${d.ot > 0 ? `<div class="otb">OT ${fmt(d.ot)} ชม.</div>` : ''}${tags.join('')}${d.note && !d.lt ? `<div class="nt">${esc(d.note)}</div>` : ''}</div>`;
  };
  $('#drawer').innerHTML = `<div class="ov" onclick="if(event.target===this)this.parentNode.innerHTML=''"><div class="sheet cal-sheet">
    <div class="card-h"><div><h2>${esc(name)} <span class="muted">(${esc(empId)})</span></h2><div class="muted">${esc(dept)} · ${mLong(month)}</div></div>
      <div class="actions"><button class="ghost" id="backDept">← รายชื่อแผนก</button><button class="ghost" onclick="document.getElementById('drawer').innerHTML=''">ปิด ✕</button></div></div>
    <div class="cal-nav"><button class="ghost" id="pm" ${prev ? '' : 'disabled'}>‹ ${prev ? mShort(prev) : ''}</button><b>${mLong(month)}</b><button class="ghost" id="nm" ${next ? '' : 'disabled'}>${next ? mShort(next) : ''} ›</button></div>
    <div class="cal-sum">
      <div><span>OT รวม</span><b>${fmt(otDays.reduce((s, d) => s + d.ot, 0))} ชม.</b></div>
      <div><span>วันที่ทำ OT</span><b>${otDays.length} วัน</b></div>
      <div><span>มาสาย</span><b>${fmt(rec.late || 0, 0)} ครั้ง</b></div>
      <div><span>ขาดงาน</span><b>${daysTxt(rec.absentDays || 0, rec.absentHours || 0)}</b></div>
      <div><span>ลากิจ / ลาป่วย</span><b>${fmt(rec.personal || 0)} / ${fmt(rec.sick || 0)} วัน</b></div>
    </div>
    ${monthCard('emp', seriesOf(r => r.empId === String(empId) && r.dept === dept), 'กราฟรายเดือนของ ' + esc(name), esc(dept))}
    <h3 class="ot-h">ปฏิทิน ${mLong(month)}</h3>
    <div class="cal-wrap"><div class="cal">
      ${WD.map((w, k) => `<div class="wh ${k === 0 || k === 6 ? 'we' : ''}">${w}</div>`).join('')}
      ${'<div class="cd empty-c"></div>'.repeat(lead)}${days.map(cell).join('')}
    </div></div>
    <div class="cal-legend"><span><i style="background:#dcf2d9"></i>มี OT</span><span><i style="background:#e3f0fb"></i>ลา</span><span><i style="background:#fdecea"></i>ขาดงาน</span><span><i style="background:#f1f3f6"></i>เสาร์–อาทิตย์</span><span><i style="background:#fff4d6"></i>วันหยุดบริษัท</span></div>
    ${otDays.length ? `<h3 class="ot-h">รายการวันที่ทำ OT</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>วันที่</th><th>เวลาเข้า</th><th>เวลาออก</th><th>กะ</th><th class="num">OT (ชม.)</th><th>หมายเหตุ</th></tr></thead><tbody>
      ${otDays.map(d => `<tr><td>${WD[new Date(d.iso + 'T00:00:00').getDay()]} ${d.d} ${TMS[m - 1]}${d.holiday ? ' (วันหยุด)' : ''}</td><td>${esc(d.tin)}</td><td>${esc(d.tout)}</td><td>${d.shift === 'night' ? 'ดึก' : 'เช้า'}</td><td class="num strong">${fmt(d.ot)}</td><td class="note-c">${esc(d.note)}</td></tr>`).join('')}
      </tbody><tfoot><tr><td colspan="4">รวม ${otDays.length} วัน</td><td class="num">${fmt(otDays.reduce((s, d) => s + d.ot, 0))}</td><td></td></tr></tfoot></table></div>` : '<div class="empty">เดือนนี้ไม่มีวันที่ทำ OT</div>'}
  </div></div>`;
  bindMonthCard('emp', (mm) => openEmp(dept, empId, mm));
  $('#backDept').onclick = () => openDept(dept);
  if (prev) $('#pm').onclick = () => openEmp(dept, empId, prev);
  if (next) $('#nm').onclick = () => openEmp(dept, empId, next);
}

function bindTips() {
  const tip = $('#tip');
  document.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('mousemove', (e) => {
      const [a, b] = el.dataset.tip.split('|'); tip.innerHTML = `<b>${esc(a)}</b><br>${esc(b || '')}`; tip.style.display = 'block';
      tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 260) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
    });
    el.addEventListener('mouseleave', () => tip.style.display = 'none');
  });
}

window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#drawer')) $('#drawer').innerHTML = ''; });
(function boot() { let code = ''; try { code = findCode(sessionStorage.getItem(MODE + 'OK')); } catch (e) {} if (code) { S.scope = ACCESS[code]; start(); } else showLogin(); })();

</script></body></html>
